{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'DevicePrice/css/login.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'DevicePrice/css/style.css' %}">
</head>
<body>


{% if user.is_authenticated %}
    <!-- Если пользователь авторизован, показываем ссылку на dashboard -->
    <a href="{% url 'dashboard' %}">Перейти в Dashboard</a>
{% else %}
    <!-- Форма для входа -->
    <form method="POST">
        {% csrf_token %}
        <a href="{% url 'index' %}" class="back-to-home">Вернуться на главную</a> <!-- Ссылка на главную страницу -->
        <label for="phone_number">Номер телефона:</label>
        <input type="text" name="phone_number" placeholder="Номер телефона" required>
        <label for="password">Пароль:</label>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>

         <div class="links">
            <a href="#">Забыли пароль?</a>
            <a href="{% url 'register' %}">Нет аккаунта? Зарегистрируйтесь!</a>
        </div>
    </form>
{% endif %}

</body>
</html>
