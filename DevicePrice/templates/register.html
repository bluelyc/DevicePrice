{% load static %}
<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Регистрация</title>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" type="text/css" href="{% static 'DevicePrice/css/registr.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'DevicePrice/css/style.css' %}">
    </head>
    <body>

    <div class="registration-container">
    <h2>Регистрация</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="surname">Фамилия:</label>
        <input type="text" id="surname" name="surname" required><br><br>

        <label for="email">Почта:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone_number">Номер телефона:</label>
        <input type="text" id="phone_number" name="phone_number" required><br><br>

        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="password_confirm">Подтверждение пароля:</label>
        <input type="password" id="password_confirm" name="password_confirm" required><br><br>

        <button type="submit">Зарегистрироваться</button>
    </form>
    </div>



</body>
</html>
